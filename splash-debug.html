<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- viewport-fit=cover so env(safe-area-inset-*) reports the real status / navigation bar sizes -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Splash debug</title>
<link rel="manifest" href="site.webmanifest" />
<style>
  html, body { margin: 0; background: #202020; color: #f2f0ea; font: 20px/1.35 system-ui, sans-serif; }
  body { padding: calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 16px); }
  h1 { font-size: 22px; margin: 0 0 8px; }
  table { border-collapse: collapse; width: 100%; }
  td { padding: 3px 4px; border-bottom: 1px solid #333; vertical-align: top; }
  td:first-child { color: #9a988f; font-size: 16px; width: 48%; }
  td:last-child { font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  button { font: inherit; font-size: 18px; padding: 10px 14px; border-radius: 10px; border: 1px solid #555; background: #2c2c2c; color: inherit; }
  .note { color: #c8c6c0; font-size: 16px; }
  #probe { position: fixed; top: 0; left: 0; width: 0; height: 0; visibility: hidden;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #pv { position: fixed; inset: 0; z-index: 10; background: #202020; display: none; }
  #pv .m { position: absolute; overflow: hidden; }
  #pv img { position: absolute; display: block; max-width: none; }
  #pv .x { position: absolute; left: 0; right: 0; height: 1px; background: #e33; }
  #pv .y { position: absolute; top: 0; bottom: 0; width: 1px; background: #e33; }
  #pv .lbl { position: absolute; left: 8px; bottom: 40px; font-size: 16px; color: #e88; }
</style>
</head>
<body>
<h1>Splash debug</h1>
<p class="note">Open this from the installed app if you can (or the browser). Screenshot this screen and send it.</p>
<table id="t"></table>
<h1 style="margin-top:14px">Launch logo (this phone only)</h1>
<table id="tune"></table>
<div class="row">
  <button data-k="canvas" data-d="-4">Smaller</button><button data-k="canvas" data-d="4">Bigger</button>
  <button data-k="dy" data-d="-2">Up</button><button data-k="dy" data-d="2">Down</button>
  <button id="circ">Circle on/off</button>
</div>
<div class="row"><button id="prev">Preview</button><button id="save">Save for next launch</button><button id="reset">Reset</button></div>
<p class="note" id="msg">Saved settings are used the next time you fully close and reopen the app.</p>
<div id="probe"></div>
<div id="pv"><div class="m"><img src="icon-maskable-512.png" width="512" height="512" alt="" /></div><div class="x"></div><div class="y"></div><div class="lbl">red lines = page centre · tap to close</div></div>
<script>
(function () {
  var DEF = { canvas: 288, mask: 192, dy: 0, circle: 1 };
  var T = Object.assign({}, DEF);
  try { var o = JSON.parse(localStorage.getItem("ps2-splash-tune") || "null"); if (o) Object.assign(T, o); } catch (e) {}
  function mq(q) { return window.matchMedia && matchMedia(q).matches; }
  function insets() { var cs = getComputedStyle(document.getElementById("probe")); return { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 }; }
  function row(k, v) { return "<tr><td>" + k + "</td><td>" + v + "</td></tr>"; }
  function fmt(n) { return Math.round(n * 10) / 10; }
  function page() {
    // With viewport-fit=cover the viewport may run under the bars; a normal page
    // (like the splash) gets this height minus the insets.
    var i = insets(), H = innerHeight;
    return { i: i, pageH: H - i.t - i.b, pageTop: i.t };
  }
  function geo() {
    var p = page(), cx = innerWidth / 2, cy = p.pageTop + p.pageH / 2 + T.dy;
    return { left: Math.round(cx - T.mask / 2), top: Math.round(cy - T.mask / 2), cy: cy, p: p };
  }
  function draw() {
    var g = geo(), i = g.p.i, vv = window.visualViewport;
    var mode = ["fullscreen", "standalone", "minimal-ui", "browser"].filter(function (m) { return mq("(display-mode: " + m + ")"); })[0] || "?";
    var medal = T.canvas * 321 / 512;
    document.getElementById("t").innerHTML =
      row("display-mode", mode + (navigator.standalone ? " (iOS app)" : "")) +
      row("innerWidth × innerHeight", innerWidth + " × " + innerHeight) +
      row("screen.width × height", screen.width + " × " + screen.height) +
      row("screen.availWidth × availHeight", screen.availWidth + " × " + screen.availHeight) +
      row("outerWidth × outerHeight", outerWidth + " × " + outerHeight) +
      row("visualViewport", vv ? fmt(vv.width) + " × " + fmt(vv.height) + " @ " + fmt(vv.offsetTop) + " · scale " + fmt(vv.scale) : "—") +
      row("devicePixelRatio", fmt(devicePixelRatio * 1000) / 1000) +
      row("safe-area top / bottom", fmt(i.t) + " / " + fmt(i.b)) +
      row("safe-area left / right", fmt(i.l) + " / " + fmt(i.r)) +
      row("page centre vs screen centre", fmt(g.p.pageTop + g.p.pageH / 2 - screen.height / 2) + " px (− = page centre higher)") +
      row("prefers-reduced-motion", mq("(prefers-reduced-motion: reduce)") ? "reduce" : "no-preference") +
      row("userAgent", "<span style='font-size:13px;font-weight:400'>" + navigator.userAgent.replace(/</g, "&lt;") + "</span>");
    document.getElementById("tune").innerHTML =
      row("canvas (image) px", T.canvas) + row("visible circle px", T.mask + (T.circle ? " (circle)" : " (square, no crop)")) +
      row("medal width px", fmt(medal)) + row("move up/down px", T.dy) +
      row("logo box (left, top, size)", g.left + ", " + g.top + ", " + T.mask + " × " + T.mask);
  }
  function preview() {
    var g = geo(), pv = document.getElementById("pv"), m = pv.querySelector(".m"), img = pv.querySelector("img");
    m.style.width = m.style.height = T.mask + "px"; m.style.left = g.left + "px"; m.style.top = g.top + "px";
    m.style.borderRadius = T.circle ? "50%" : "0";
    img.style.width = img.style.height = T.canvas + "px"; img.style.left = img.style.top = Math.round((T.mask - T.canvas) / 2) + "px";
    pv.querySelector(".x").style.top = Math.round(g.cy - T.dy) + "px"; pv.querySelector(".y").style.left = Math.round(innerWidth / 2) + "px";
    pv.style.display = "block";
  }
  document.querySelectorAll("button[data-k]").forEach(function (b) {
    b.onclick = function () {
      var k = b.dataset.k, d = +b.dataset.d;
      T[k] += d;
      if (k === "canvas") { T.canvas = Math.max(96, Math.min(480, T.canvas)); T.mask = Math.round(T.canvas * 2 / 3); }
      if (k === "dy") T.dy = Math.max(-120, Math.min(120, T.dy));
      draw();
    };
  });
  document.getElementById("circ").onclick = function () { T.circle = T.circle ? 0 : 1; draw(); };
  document.getElementById("prev").onclick = preview;
  document.getElementById("pv").onclick = function () { this.style.display = "none"; };
  document.getElementById("save").onclick = function () {
    try { localStorage.setItem("ps2-splash-tune", JSON.stringify(T)); document.getElementById("msg").textContent = "Saved. Fully close the app and reopen it to see it."; } catch (e) { document.getElementById("msg").textContent = "Could not save: " + e; }
  };
  document.getElementById("reset").onclick = function () {
    try { localStorage.removeItem("ps2-splash-tune"); } catch (e) {}
    T = Object.assign({}, DEF); draw(); document.getElementById("msg").textContent = "Back to the default (canvas 288, circle 192, centred).";
  };
  draw();
  addEventListener("resize", draw);
  if (window.visualViewport) visualViewport.addEventListener("resize", draw);
})();
</script>
</body>
</html>
