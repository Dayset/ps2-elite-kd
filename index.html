<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PS2 Elite K/D — opposition-weighted curve</title>
  <meta name="description" content="PlanetSide 2 elite K/D vs enemy weapon KPM comparison chart" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>🦁❤ PlanetSide 2 — Elite K/D</h1>
  </header>

  <div class="controls">
    <label for="namesInput">Players</label>
    <div id="namesBox" class="names-box" role="group" aria-label="Player names">
      <div class="names-box-main">
        <div id="nameTokens" class="name-tokens"></div>
        <input id="namesInput" type="text" placeholder="JustV6me ChrisJTTR" autocomplete="off" spellcheck="false" />
      </div>
      <button id="clearNamesBtn" type="button" class="clear-names" title="Clear names from input" aria-label="Clear names from input">×</button>
    </div>
    <button id="analyzeBtn" type="button">Analyze</button>
    <button id="copyLinkBtn" type="button" title="Copy shareable URL with current names">Copy link</button>

    <div class="fresh-row">
      <label class="fresh-label" for="fetchFresh">
        <input id="fetchFresh" type="checkbox" autocomplete="off" />
        Fetch fresh data
      </label>
    </div>

    <div id="cacheChips" class="cache-chips" aria-label="Cached character names"></div>
    <div id="lastLink" class="last-link" aria-label="Latest comparison"></div>
  </div>

  <div id="status"></div>
  <div id="progress" class="progress" hidden>
    <span class="spinner" aria-hidden="true"></span>
    <span id="progressText"></span>
  </div>
  <div id="underLoadNote" class="under-load" hidden role="status">
    The server is under load right now, please be patient.
  </div>

  <div class="chart-wrap empty">
    <div id="chartPlaceholder" class="chart-placeholder" aria-hidden="false">
      <img src="assets/placeholder-graph.webp" alt=""
           onerror="this.onerror=null;this.src='assets/placeholder-graph.png'" />
      <div class="chart-placeholder-overlay">
        <span class="chart-placeholder-cta">Press Analyze</span>
      </div>
    </div>
    <svg id="chart" viewBox="0 0 1000 580" preserveAspectRatio="xMidYMid meet" hidden></svg>
  </div>

  <div id="statsPanel" class="stats-panel" aria-label="Player stats comparison"></div>
  <div id="legend" class="legend"></div>

  <footer>
    <p><a href="https://github.com/Dayset/ps2-elite-kd">github.com/Dayset/ps2-elite-kd</a></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
