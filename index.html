<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PS2 Elite K/D — opposition-weighted curve</title>
  <meta name="description" content="PlanetSide 2 elite K/D vs enemy weapon KPM comparison chart" />
  <link rel="stylesheet" href="styles.css?v=20261007-cachefold" />
</head>
<body>
  <div class="controls">
    <label for="namesInput">Players</label>
    <div id="namesBox" class="names-box" role="group" aria-label="Player names">
      <div class="names-box-main">
        <div id="nameTokens" class="name-tokens"></div>
        <input id="namesInput" type="text" placeholder="ShloDog" autocomplete="off" spellcheck="false" />
      </div>
      <button id="clearNamesBtn" type="button" class="clear-names" title="Clear names from input" aria-label="Clear names from input">×</button>
    </div>
    <button id="analyzeBtn" type="button">🔍 Analyze</button>
    <button id="copyLinkBtn" type="button" title="Copy shareable URL with current names">Copy link</button>

    <div class="fresh-row">
      <label class="fresh-label" for="fetchFresh">
        <input id="fetchFresh" type="checkbox" autocomplete="off" />
        Fetch fresh data
      </label>
    </div>

    <div id="cacheChips" class="cache-chips" aria-label="Cached character names"></div>
    <div id="lastLink" class="last-link" aria-label="Latest comparison"></div>
    <div class="controls-theme-row">
      <button id="wipeLocalBtn" type="button" class="wipe-local" title="Clear all local app data (cache, theme, flags)" aria-label="Clear all local app data">🗑️</button>
      <button id="themeToggle" type="button" class="theme-toggle" title="Toggle light / dark theme" aria-label="Toggle light / dark theme">☀️ Light</button>
    </div>
  </div>

  <div id="status"></div>
  <div id="underLoadNote" class="under-load under-load-page" hidden role="status">
    ⏳ The server is under load right now, please be patient.
  </div>

  <div id="progress" class="progress-modal" hidden aria-hidden="true">
    <div class="progress-modal-backdrop" aria-hidden="true"></div>
    <div class="progress-modal-card" role="dialog" aria-modal="true" aria-labelledby="progressTitle" aria-describedby="progressText">
      <div class="progress-modal-spinner" aria-hidden="true">
        <span class="spinner spinner-lg"></span>
      </div>
      <h2 id="progressTitle" class="progress-title">Analyzing…</h2>
      <p id="progressText" class="progress-text"></p>
      <div class="progress-bar-track" aria-hidden="true">
        <div id="progressBar" class="progress-bar-fill" style="width: 0%"></div>
      </div>
      <div class="progress-meta">
        <span id="progressPct">0%</span>
        <span id="progressTiming" class="progress-timing"></span>
      </div>
      <div id="underLoadInModal" class="under-load under-load-modal" hidden role="status">
        ⏳ The server is under load right now, please be patient.
      </div>
    </div>
  </div>

  <div id="statsPanel" class="stats-panel" aria-label="Player stats comparison"></div>

  <div class="chart-wrap empty">
    <div id="chartYZoom" class="chart-y-zoom" hidden title="Y-axis zoom. Middle = auto-fit. Up enlarges weak curves; down fits extreme / high-tier K/D.">
      <input id="yZoomSlider" type="range" min="-2" max="2" step="0.05" value="0"
             orient="vertical"
             aria-label="Y-axis zoom (center = auto fit)"
             aria-orientation="vertical" />
      <button type="button" id="yZoomReset" class="chart-y-zoom-reset" title="Reset Y zoom to auto-fit">Auto</button>
    </div>
    <div id="chartPlaceholder" class="chart-placeholder" aria-hidden="false">
      <img class="ph-img ph-dark" src="assets/placeholder-graph.webp" alt=""
           onerror="this.onerror=null;this.src='assets/placeholder-graph.png'" />
      <img class="ph-img ph-light" src="assets/placeholder-graph-light.webp" alt=""
           onerror="this.onerror=null;this.src='assets/placeholder-graph-light.png'" />
      <div class="chart-placeholder-overlay">
        <span class="chart-placeholder-cta">▶️ Press Analyze</span>
      </div>
    </div>
    <svg id="chart" viewBox="0 0 1000 580" preserveAspectRatio="xMidYMid meet" hidden></svg>
  </div>

  <div id="legend" class="legend"></div>

  <footer>
    <p><a href="https://github.com/Dayset/ps2-elite-kd">github.com/Dayset/ps2-elite-kd</a></p>
    <p>Thanks to <a href="https://wt.honu.pw/" target="_blank" rel="noopener noreferrer">HONU</a> / Varunda</p>
  </footer>

  <script type="module" src="app.js?v=20261007-cachefold"></script>
</body>
</html>
