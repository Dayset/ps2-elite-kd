# ps2-elite-kd-cache: matches the live Worker's bindings (2026-10-13).
# Deployed only by .github/workflows/deploy-worker.yml (manual run).
name = "ps2-elite-kd-cache"
main = "src/worker.js"
# Check Cloudflare dashboard → Worker → Settings → Runtime and keep this equal
# to the live value before the first deploy.
compatibility_date = "2025-07-18"
workers_dev = true

# Keep the plain-text variables set in the dashboard (GH_REPO, limits, …).
# Secrets (GH_TOKEN, CENSUS_PROXY_KEY) are never touched by a deploy.
keep_vars = true

[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "QUEUE"
id = "3adfe0d9994a4b92b32c132168faf3cd"

# Pilot live kill recorder (t372u): one SQLite-backed Durable Object (free plan).
[[durable_objects.bindings]]
name = "KILL_MONITOR"
class_name = "KillMonitor"

[[migrations]]
tag = "v1-kill-monitor"
new_sqlite_classes = ["KillMonitor"]

# 🤺 Duel pair cache (#83): one SQLite-backed Durable Object per player history
# (name "<ns>:<cid>"), created on first request, deleted after 120 days unused.
[[durable_objects.bindings]]
name = "DUEL_STORE"
class_name = "DuelStore"

[[migrations]]
tag = "v2-duel-store"
new_sqlite_classes = ["DuelStore"]

# PS2MapOracle: the 5-minute cron asks ps2-oracle for queued Honu work
# (src/oracle-tick.js). Worker-to-Worker calls need a service binding.
[[services]]
binding = "ORACLE"
service = "ps2-oracle"
