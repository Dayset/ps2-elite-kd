<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:," />
  <title>PS2 Elite K/D: update log</title>
  <script>
    // Same theme key as the main page (set before paint).
    try {
      if (localStorage.getItem("ps2-elite-kd-theme") === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css?v=20261017-disthint" />
  <style>
    body { overflow: auto; }
    .st-wrap { max-width: none; margin: 0; padding: 0; }
    .st-wrap h1 { font-size: 1.25rem; margin: 0 0 4px; }
    .st-sub { color: var(--dim); font-size: 0.85rem; margin-bottom: 16px; }
    .st-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
    .st-dim { color: var(--dim); }
    .st-err { color: #ff8a8a; }
    .st-wrap a { color: var(--accent); }
    .st-day { font-size: 1rem; margin: 20px 0 8px; }
    .st-entry { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--row-border); }
    .st-entry:first-of-type { border-top: none; }
    .st-avatar { width: 28px; height: 28px; border-radius: 50%; flex: 0 0 auto; margin-top: 2px; }
    .st-entry-body { min-width: 0; }
    .st-entry-msg { font-weight: 600; overflow-wrap: anywhere; }
    .st-entry-desc { color: var(--dim); font-size: 0.85rem; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 2px; }
    .st-entry-meta { color: var(--dim); font-size: 0.8rem; margin-top: 2px; }
    .st-toggle { margin: 4px 0 12px; font-size: 0.85rem; }
    .st-toggle label { cursor: pointer; }
  </style>
</head>
<body>
  <main class="st-wrap">
    <h1>Update log</h1>
    <div class="st-sub">Latest changes, live from GitHub. A fix shows up here as soon as it is pushed. <a href="index.html">Back to the stats</a> · <a href="columns.html">What the columns mean</a> · <a href="https://github.com/Dayset/ps2-elite-kd/commits/main">Full history on GitHub</a></div>
    <div class="st-toggle"><label><input type="checkbox" id="showCache" /> show routine cache refreshes</label></div>
    <div class="st-card"><div id="log" class="st-dim">Loading…</div></div>
  </main>
  <script type="module">
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>\"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    const API = "https://api.github.com/repos/Dayset/ps2-elite-kd/commits?per_page=100";
    const isCache = (c) => /^chore\(cache\)/i.test(c.commit.message || "");

    let commits = [];

    function render() {
      const showCache = $("showCache").checked;
      const hidden = commits.filter(isCache).length;
      const list = commits.filter((c) => showCache || !isCache(c));
      if (!list.length) {
        $("log").innerHTML = '<span class="st-dim">No changes to show.</span>';
        return;
      }
      let html = "";
      if (!showCache && hidden > 0) html += '<p class="st-dim">' + hidden + " routine cache refresh" + (hidden === 1 ? "" : "es") + " hidden — tick the box above to show them.</p>";
      let lastDay = "";
      for (const c of list) {
        const date = (c.commit.committer && c.commit.committer.date || "").slice(0, 10);
        if (date && date !== lastDay) { html += '<h2 class="st-day">' + esc(date) + "</h2>"; lastDay = date; }
        const msg = c.commit.message || "";
        const nl = msg.indexOf("\n");
        const title = nl >= 0 ? msg.slice(0, nl) : msg;
        const body = nl >= 0 ? msg.slice(nl + 1).trim() : "";
        const author = (c.author && c.author.login) || (c.commit.author && c.commit.author.name) || "unknown";
        const avatar = c.author && c.author.avatar_url
          ? '<img class="st-avatar" src="' + esc(c.author.avatar_url) + '" alt="" loading="lazy" />'
          : '<span class="st-avatar"></span>';
        const time = (c.commit.committer && c.commit.committer.date || "").slice(11, 16);
        html += '<div class="st-entry">' + avatar + '<div class="st-entry-body">'
          + '<div class="st-entry-msg">' + esc(title) + "</div>"
          + (body ? '<div class="st-entry-desc">' + esc(body.slice(0, 500)) + "</div>" : "")
          + '<div class="st-entry-meta">' + esc(author) + (time ? " · " + esc(time) + " UTC" : "")
          + ' · <a href="' + esc(c.html_url) + '" target="_blank" rel="noopener noreferrer">commit</a></div>'
          + "</div></div>";
      }
      $("log").innerHTML = html;
    }

    $("showCache").addEventListener("change", render);

    fetch(API, { headers: { Accept: "application/vnd.github+json" } })
      .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then((data) => { commits = Array.isArray(data) ? data : []; render(); })
      .catch(() => {
        $("log").innerHTML = '<span class="st-err">Couldn’t load the update log from GitHub (rate limit or network).</span> See the <a href="https://github.com/Dayset/ps2-elite-kd/commits/main">full history on GitHub</a>.';
      });
  </script>
</body>
</html>
