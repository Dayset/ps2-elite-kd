<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>404 · This base doesn't exist</title>
<!-- Custom GitHub Pages 404 (owner 2026-10-31). Self-contained on purpose:
     no external CSS/JS, so it renders at any path depth (relative links
     would break on deep 404 URLs, and project Pages has no site-root path).
     Static English by the same precedent as the build-log blurbs. -->
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0b0c0e; color: #f2f0ea;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    padding: 1.5rem;
  }
  main { text-align: center; max-width: 34rem; }
  .code {
    font-size: 5rem; line-height: 1; font-weight: 700; color: #9fd4ee;
    font-variant-numeric: tabular-nums; margin: 0 0 0.5rem;
  }
  h1 { font-size: 1.5rem; margin: 0 0 0.5rem; font-weight: 600; }
  p { color: #c8c6c0; margin: 0 0 1.5rem; line-height: 1.5; }
  .btns { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
  a.home, button.back {
    font: inherit; cursor: pointer; text-decoration: none;
    padding: 0.55rem 1.1rem; border-radius: 0; border: 1px solid #9fd4ee;
  }
  a.home { background: #9fd4ee; color: #0b0c0e; font-weight: 600; }
  button.back { background: transparent; color: #f2f0ea; }
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>🗺️ This base doesn't exist.</h1>
  <p>The coordinates you followed don't point to a base on this map.</p>
  <div class="btns">
    <a class="home" href="https://dayset.github.io/ps2-elite-kd/">Back to the map</a>
    <button class="back" type="button" onclick="history.back()">Go back</button>
  </div>
</main>
</body>
</html>
