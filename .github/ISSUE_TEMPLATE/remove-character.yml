name: 🚫 Remove my character
description: Ask for your PlanetSide 2 character to be removed from PS2 Elite (stats, Rankings, opponent lists).
title: "Remove my character: "
labels: ["privacy"]
body:
  - type: markdown
    attributes:
      value: |
        PS2 Elite shows public game stats from the Daybreak Census API. If you play the character below and don't want it shown here, we remove it: the cached stats are deleted, the bots stop fetching it, it leaves Rankings, its name is blanked in other players' opponent lists, and the site shows "removed at the player's request" instead of stats.

        **This issue is public.** Only write the character name, nothing else about you. The stats themselves stay on Daybreak's servers and on other sites; we can only remove our copy. Details: [privacy page](https://dayset.github.io/ps2-elite-kd/privacy.html).
  - type: dropdown
    id: room
    attributes:
      label: Platform and server
      options:
        - PC
        - PlayStation, Genudine (US)
        - PlayStation, Ceres (EU)
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Character name
      description: Without the outfit tag.
    validations:
      required: true
  - type: checkboxes
    id: own
    attributes:
      label: Confirmation
      options:
        - label: I play this character.
          required: true
  - type: markdown
    attributes:
      value: |
        We may ask you to show that the character is yours. On PC the easiest way is to sign in once on the [Oracle page](https://dayset.github.io/ps2-elite-kd/oracle/): it only asks you to log out of the game within a short window.
