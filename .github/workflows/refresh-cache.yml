name: Refresh shared cache

# Fully automatic: every hour the stalest BATCH_SIZE players (never-fetched
# first) are re-fetched from Census + Honu and committed to data/. All ~225
# names rotate through every few hours. No manual steps needed.
#
# On-demand: a dispatch with inputs.names (e.g. from the site's Cloudflare
# Worker when someone analyzes a new name) refreshes ONLY those names, adds the
# ones that fetched OK to data/watchlist.txt, and skips the rotation batch.

on:
  schedule:
    # Hourly at :17 UTC (off-peak; GitHub often drops/delays :00 crons).
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      names:
        description: "Names to refresh now (comma/space-separated); successes join the watchlist. Empty = normal rotation batch."
        required: false
        default: ""
      batch_size:
        description: "Rotation batch size when names is empty"
        required: false
        default: "20"

permissions:
  contents: write # commit data/
  actions: write  # keepalive: re-enable this workflow (60-day inactivity rule)

# One run at a time. On-demand dispatches queue behind a running batch
# (never cancel it), and queue: max keeps every pending dispatch instead of
# replacing the older pending one.
concurrency:
  group: refresh-shared-cache
  cancel-in-progress: false
  queue: max

env:
  BATCH_SIZE: ${{ github.event.inputs.batch_size || '20' }}
  TIME_BUDGET_MIN: "30"      # rotation: stop starting new players after this
  ON_DEMAND_BUDGET_MIN: "10" # inputs.names runs stay short
  ON_DEMAND: ${{ github.event.inputs.names != '' && github.event.inputs.names != null && 'true' || 'false' }}
  RUN_KIND: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Latest tip at job start (queued runs see the previous run's data).
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Keep schedule alive (60-day inactivity rule)
        # No-op for an active workflow, but resets GitHub's inactivity timer.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/refresh-cache.yml/enable"
          echo "Workflow re-enabled (keepalive ok)"

      - name: Raise under-load flag
        if: env.ON_DEMAND != 'true' # on-demand runs are short; no banner/extra commit
        continue-on-error: true # a missed banner must not block the refresh
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          node -e '
            const fs = require("fs");
            fs.writeFileSync("data/load-flag.json", JSON.stringify({
              fetching: true, ts: Date.now(), source: "actions",
              runId: process.env.RUN_ID || null,
              message: "Shared cache refresh in progress",
            }, null, 2) + "\n");
          '
          scripts/ci-commit-push.sh "chore(cache): under-load flag on [bot]"

      - name: Refresh players (rotation batch or on-demand names)
        id: refresh
        env:
          NAMES: ${{ github.event.inputs.names || '' }}
        run: node scripts/refresh-cache.mjs

      - name: Commit cache + clear under-load flag
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          OK: ${{ steps.refresh.outputs.ok || '0' }}
        run: |
          # Clear the flag only if it is raised (avoids no-op commits on on-demand runs).
          node -e '
            const fs = require("fs");
            let cur = {};
            try { cur = JSON.parse(fs.readFileSync("data/load-flag.json", "utf8")); } catch {}
            if (cur.fetching !== false) {
              fs.writeFileSync("data/load-flag.json", JSON.stringify({
                fetching: false, ts: Date.now(), source: "actions",
                runId: process.env.RUN_ID || null, message: null,
              }, null, 2) + "\n");
            }
          '
          if [ "$ON_DEMAND" = "true" ]; then
            msg="chore(cache): on-demand refresh, ${OK} player(s) updated [bot]"
          else
            msg="chore(cache): ${RUN_KIND} refresh, ${OK} player(s) updated [bot]"
          fi
          scripts/ci-commit-push.sh "$msg"
