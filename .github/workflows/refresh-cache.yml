name: Refresh shared cache

# Grows the shared cache with NEW players; cached players are never re-fetched
# by background runs (only on demand, e.g. "Fetch fresh" via the Worker).
#
# Driver: each background run writes data/schedule.json (nextDueAt, or null
# when idle). The Cloudflare Worker (ps2-elite-kd-cache) cron reads that static
# file every 5 min and dispatches only when a run is due (or /add names are
# stuck pending); GitHub's hourly cron is a fallback. An idle run (cache at
# CRAWL_INDEX_CAP, nothing due) makes no network calls at all.
# Discovery: names from data/top-killers.txt (static seed, no live scraping)
# and frequent opponents of cached players, up to CRAWL_INDEX_CAP. Then the
# daily refresh: cached players saved > 24 h ago, oldest first, within the
# time budget (refresh-only runs are spaced ~1 h apart via schedule.json).
# All per-player data comes from Census in ~5 batched calls (census-fetch.mjs).
#
# Pages: exactly ONE commit per run, none if no player file changed.

on:
  schedule:
    # Fallback only (GitHub has not been firing this reliably).
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      names:
        description: "Names to refresh now (comma/space-separated); successes join the watchlist. Empty = background discovery run."
        required: false
        default: ""

permissions:
  contents: write # commit data/
  actions: write  # keepalive: re-enable this workflow (60-day inactivity rule)

# One run at a time. On-demand dispatches queue behind at most one short
# background run (never cancel it); queue: max keeps every pending dispatch.
concurrency:
  group: refresh-shared-cache
  cancel-in-progress: false
  queue: max

env:
  TIME_BUDGET_MIN: "9"       # background: stop starting new players after ~9 min
  ON_DEMAND_BUDGET_MIN: "10" # inputs.names runs
  CRAWL_MAX: "50"            # background: max new players per run (time budget usually binds first)
  CRAWL_INDEX_CAP: "1500"    # stop adding at this many cached players
  # Daybreak Census service ID (registered, public client-side value; a repo
  # secret/variable CENSUS_SERVICE_ID overrides it). Data comes from Census;
  # Honu only as a paced fallback for missing history_stats.
  CENSUS_SERVICE_ID: ${{ secrets.CENSUS_SERVICE_ID || vars.CENSUS_SERVICE_ID || 'daysetps2legends' }}
  ON_DEMAND: ${{ github.event.inputs.names != '' && github.event.inputs.names != null && 'true' || 'false' }}
  RUN_KIND: ${{ github.event_name == 'schedule' && 'scheduled' || (github.event.inputs.names != '' && github.event.inputs.names != null) && 'on-demand' || 'discovery' }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Latest tip at job start (queued runs see the previous run's data).
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Keep schedule alive (60-day inactivity rule)
        # No-op for an active workflow, but resets GitHub's inactivity timer.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/refresh-cache.yml/enable"
          echo "Workflow re-enabled (keepalive ok)"

      - name: Fetch players (new-player discovery, or on-demand names)
        id: refresh
        env:
          NAMES: ${{ github.event.inputs.names || '' }}
        run: node scripts/refresh-cache.mjs

      - name: Commit (one commit per run, skipped if nothing refreshed)
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          OK: ${{ steps.refresh.outputs.ok || '0' }}
          NEW: ${{ steps.refresh.outputs.new || '0' }}
        run: |
          # Count saved player files from git itself (works even if the step was cut short).
          changed=$(git status --porcelain -- data/players | wc -l)
          if [ "$changed" = "0" ]; then
            # Nothing refreshed (idle / outage / all names bad): don't spend a Pages
            # build on bookkeeping. Only a changed data/schedule.json (read by the
            # Worker cron to decide whether to dispatch) is committed on its own.
            cp data/schedule.json /tmp/schedule.json 2>/dev/null || true
            git checkout -- data/ && git clean -fdq data/
            if [ -f /tmp/schedule.json ] && ! cmp -s /tmp/schedule.json data/schedule.json; then
              cp /tmp/schedule.json data/schedule.json
              git add data/schedule.json
              scripts/ci-commit-push.sh "chore(cache): schedule $(node -p 'JSON.parse(require("fs").readFileSync("data/schedule.json","utf8")).reason') [bot]"
            else
              echo "No players refreshed; no commit."
            fi
            exit 0
          fi
          # Keep ranks.html in sync with the cache (no network; same player-metrics.mjs).
          node scripts/build-ranks.mjs || echo "::warning::build-ranks failed; data/ranks.json not updated this run"
          # Refit the 👻 ghost population model on the same cache (no network; same commit).
          node scripts/build-ghost-model.mjs || { git checkout -- data/ghost-model.mjs 2>/dev/null; echo "::warning::build-ghost failed; data/ghost-model.mjs not updated this run"; }
          # status.json: mark idle. load-flag.json: background runs no longer raise
          # the main page's "under load" banner; make sure it's cleared.
          node -e '
            const fs = require("fs");
            let st = {};
            try { st = JSON.parse(fs.readFileSync("data/status.json", "utf8")); } catch {}
            if (st.running !== false || st.current) {
              st.running = false;
              st.current = null;
              fs.writeFileSync("data/status.json", JSON.stringify(st, null, 2) + "\n");
            }
            let cur = {};
            try { cur = JSON.parse(fs.readFileSync("data/load-flag.json", "utf8")); } catch {}
            if (cur.fetching !== false) {
              fs.writeFileSync("data/load-flag.json", JSON.stringify({
                fetching: false, ts: Date.now(), source: "actions",
                runId: process.env.RUN_ID || null, message: null,
              }, null, 2) + "\n");
            }
          '
          scripts/ci-commit-push.sh "chore(cache): ${RUN_KIND} refresh, ${changed} player file(s), ${NEW} new [bot]"

      - name: Chain next background run (growth)
        # Only after a background run that added players and left names over.
        # Outages / empty queues end the chain; the Worker or GitHub cron restarts it.
        if: success() && env.ON_DEMAND != 'true' && steps.refresh.outputs.more == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          waiting=$(gh run list --workflow refresh-cache.yml --json status --jq '[.[] | select(.status=="queued" or .status=="waiting" or .status=="pending" or .status=="requested")] | length')
          if [ "${waiting:-0}" != "0" ]; then
            echo "A run is already queued ($waiting); not chaining."
            exit 0
          fi
          gh workflow run refresh-cache.yml --ref "${{ github.event.repository.default_branch }}" -f names=
          echo "Next background run dispatched."
