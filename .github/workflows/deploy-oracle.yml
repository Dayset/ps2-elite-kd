name: Deploy oracle Worker

# ps2-oracle (PS2MapOracle backend). Deploys automatically when the Worker or
# the model files change on main; can also be run by hand.
# Uses the same CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID as deploy-worker.yml.
# ORACLE_KEY (write key for /commander and /export) is set from CENSUS_PROXY_KEY.

on:
  push:
    branches: [main]
    paths:
      - "oracle-worker/**"
      - "oracle/backend/winbins_*.json"
      - "oracle/backend/*_region_to_facility.json"
      - "test/oracle-*.test.mjs"
      - "radar.mjs"
      - ".github/workflows/deploy-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-oracle
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            oracle-worker
            oracle/backend
            test
            radar.mjs
            package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild split models
        run: node oracle-worker/build-trees.mjs

      - name: Oracle tests
        # Failing test names go to annotations (job logs are not always readable where this is debugged).
        run: |
          node --test test/oracle-engine.test.mjs test/oracle-worker.test.mjs test/oracle-commander.test.mjs test/oracle-outliers.test.mjs test/oracle-auth.test.mjs test/oracle-privacy.test.mjs > oracle-tests.log 2>&1 && exit 0
          grep -E "^ *not ok|^ *error:|^ *(expected|actual):" oracle-tests.log | head -9 | sed 's/^ */::error::/'
          tail -3 oracle-tests.log
          exit 1

      # Plain wrangler (not wrangler-action) so a failure's message reaches the
      # run's annotations: job logs are not always readable where this is debugged.
      - name: Deploy
        working-directory: oracle-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npx --yes wrangler@4 deploy > deploy.log 2>&1
          rc=$?
          cat deploy.log
          if [ $rc -ne 0 ]; then
            grep -vE '^\s*$|^─|wrangler [0-9]' deploy.log | tail -n 15 | while IFS= read -r l; do echo "::error::$l"; done
          else
            grep -iE 'schedule|trigger|cron|deployed|warn|version' deploy.log | head -n 12 | while IFS= read -r l; do echo "::notice::$l"; done
          fi
          exit $rc

      - name: Show registered triggers
        working-directory: oracle-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/ps2-oracle/schedules" > sched.json || true
          echo "::notice::schedules: $(head -c 600 sched.json | tr -d '\n')"

      # After the deploy: secrets can only be uploaded to a Worker that exists.
      - name: Set ORACLE_KEY
        working-directory: oracle-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ORACLE_KEY: ${{ secrets.CENSUS_PROXY_KEY }}
        run: |
          if [ -z "$ORACLE_KEY" ]; then echo "::warning::CENSUS_PROXY_KEY not set; /export and /commander stay locked"; exit 0; fi
          printf '%s' "$ORACLE_KEY" | npx --yes wrangler@4 secret put ORACLE_KEY
