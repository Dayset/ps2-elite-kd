name: PlayStation scrims

# 🥊 PlayStation scrims (owner 2026-10-28): find 1v1 / small-group scrims in the PS players'
# KILL / DEATH history and write down date + result (data-ps/scrims/<key>.json), going back
# through each player's whole history over many runs (newest first, shallowest players first).
# PS namespaces only (ps2ps4us / ps2ps4eu), via the cache Worker's Census proxy, 30 calls/min.
# Commits data-ps/scrims/ and data-ps/scrims-state.json only. Its own concurrency group: it
# touches no file the PS refresh writes, so the two can run side by side.
#
# mode=run (schedule): one background round (scripts/ps-scrims.mjs --run).
# mode=probe: measurement only. Pages back through the named players' history and pushes the
#   compact events to the side branch claude/scrim-probe (never to main).

on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run | probe"
        required: false
        default: "run"
      names:
        description: "PS names or keys (probe)"
        required: false
        default: ""
      pages:
        description: "Census pages (1,000 events) per player (probe: total; run: per older-history visit)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ps-scrims
  cancel-in-progress: false

env:
  CENSUS_RPM: "30"
  TIME_BUDGET_MIN: "20"
  CENSUS_SERVICE_ID: ${{ secrets.CENSUS_SERVICE_ID || vars.CENSUS_SERVICE_ID || 'daysetps2legends' }}
  CENSUS_PROXY: ${{ vars.CENSUS_PROXY || 'https://ps2-elite-kd-cache.dayset.workers.dev' }}
  CENSUS_PROXY_KEY: ${{ secrets.CENSUS_PROXY_KEY }}

jobs:
  scrims:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Probe (side branch only)
        if: github.event.inputs.mode == 'probe'
        env:
          NAMES: ${{ github.event.inputs.names }}
          PAGES: ${{ github.event.inputs.pages || '20' }}
          TIME_BUDGET_MIN: "25"
        run: |
          node scripts/ps-scrims.mjs --probe "$NAMES" --pages "$PAGES"
          git checkout -q -b claude/scrim-probe
          git add -f scrim-probe
          git commit -q -m "scrim probe: raw compact events (measurement only) [bot]" || exit 0
          git push -q -f origin HEAD:refs/heads/claude/scrim-probe

      - name: Find scrims (data-ps/scrims only)
        id: run
        if: github.event.inputs.mode != 'probe'
        continue-on-error: true
        env:
          PAGES: ${{ github.event.inputs.pages || '3' }}
          NAMES: ${{ github.event.inputs.names || '' }} # these players' whole history first
        run: node scripts/ps-scrims.mjs --run

      - name: Commit (data-ps/scrims only, one commit per run)
        if: always() && github.event.inputs.mode != 'probe'
        env:
          COMMIT_DIR: data-ps/
        run: |
          # Guard: this workflow must never leave a change outside data-ps/scrims*.
          stray=$(git status --porcelain | grep -v ' data-ps/scrims' || true)
          if [ -n "$stray" ]; then
            echo "::error::scrims run changed files outside data-ps/scrims*: $stray"
            git checkout -- . ':!data-ps/scrims' ':!data-ps/scrims-state.json' 2>/dev/null || true
            git clean -fdq -- . ':!data-ps/scrims' ':!data-ps/scrims-state.json' 2>/dev/null || true
          fi
          scripts/ci-commit-push.sh "chore(ps-scrims): ${{ steps.run.outputs.scrims || '0' }} scrims, ${{ steps.run.outputs.files || '0' }} files [bot]"
