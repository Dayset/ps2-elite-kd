name: Tests
# #66: the full suite runs here on every code push, so a test the local `npm run test:changed` skipped (real-store,
# heavy browser tests) still fails within minutes. Bot data commits (data/, data-ps/) don't start it.
on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "data-ps/**", "**/*.md"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    name: Node tests (full, no browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: npm test
        run: |
          # the runner image ships google-chrome, which the browser tests would find and run here in parallel:
          # leave them to the browser job (one at a time)
          set -o pipefail
          files=$(grep -LE "chromium|playwright" test/*.test.mjs)
          node --test --test-reporter=tap $files | tee tap.txt
      - name: Name the failures
        if: failure()
        # the test name plus the assertion message under it (GitHub keeps 10 annotations per step)
        run: |
          awk '/^ *not ok/ { sub(/^ *not ok [0-9]+ - /, ""); print "::error::" $0 } m { sub(/^ */, ""); print "::error::  " $0; m = 0 } /error: \|-$/ { m = 1 }' tap.txt | head -10
  browser:
    name: Browser tests (headless Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Put Chromium on PATH
        run: |
          mkdir -p "$HOME/bin"
          ln -sf "$(find "$HOME/.cache/ms-playwright" -path '*chrome-linux*/chrome' -type f | head -1)" "$HOME/bin/chromium"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Browser tests
        # Left out until #62 is fixed: ranks-no-nan (times out at 420 s) and dist-bin-jump (bar-click separator).
        run: |
          set -o pipefail
          files=$(grep -lE "chromium|playwright" test/*.test.mjs | grep -vE "ranks-no-nan|dist-bin-jump")
          PLAYWRIGHT_MODULE="$PWD/node_modules/playwright/index.mjs" node --test --test-concurrency=1 --test-reporter=tap $files | tee tap.txt
          ! grep -q "^# skipped [1-9]" tap.txt || { echo "::error::browser tests skipped (no Chromium?)"; exit 1; }
      - name: Name the failures
        if: failure()
        # the test name plus the assertion message under it (GitHub keeps 10 annotations per step)
        run: |
          awk '/^ *not ok/ { sub(/^ *not ok [0-9]+ - /, ""); print "::error::" $0 } m { sub(/^ */, ""); print "::error::  " $0; m = 0 } /error: \|-$/ { m = 1 }' tap.txt | head -10
