name: Duels Glicko eval

# #112 measurement only: pairwise Glicko-2 replay vs the static 🎲 fit on held-out kills
# (scripts/glicko-eval.mjs). PC Census history via the cache Worker proxy, read-only.
# Results as ::notice:: annotations + data/duel-glicko-eval.json (the only file it commits).

on:
  workflow_dispatch:
    inputs:
      pagers:
        description: "players whose history is read"
        required: false
        default: "40"
      pages:
        description: "Census pages (1,000 events) per player"
        required: false
        default: "15"

permissions:
  contents: write

concurrency:
  group: glicko-eval
  cancel-in-progress: false

env:
  CENSUS_RPM: "40"
  TIME_BUDGET_MIN: "25"
  CENSUS_SERVICE_ID: ${{ secrets.CENSUS_SERVICE_ID || vars.CENSUS_SERVICE_ID || 'daysetps2legends' }}
  CENSUS_PROXY: ${{ vars.CENSUS_PROXY || 'https://ps2-elite-kd-cache.dayset.workers.dev' }}
  CENSUS_PROXY_KEY: ${{ secrets.CENSUS_PROXY_KEY }}

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Evaluate
        run: node scripts/glicko-eval.mjs --pagers "${{ github.event.inputs.pagers || '40' }}" --pages "${{ github.event.inputs.pages || '15' }}"
      - name: Commit report
        env:
          COMMIT_DIR: data/duel-glicko-eval.json
        run: scripts/ci-commit-push.sh "chore(duels): glicko eval report (#112) [bot]"
