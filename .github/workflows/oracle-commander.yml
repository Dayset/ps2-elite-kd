name: Oracle commander

# Manual cross-check only. Since 2026-10-18 the Worker computes the AI Commander
# itself every minute (oracle-worker/src/commander.js, a parity-tested port of
# commander_live.py). Running this posts the Python result for the live alerts
# instead (it overwrites the Worker's until the next minute), useful to compare
# the two by eye.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-commander
  cancel-in-progress: true

jobs:
  commander:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: oracle/backend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Commander for live alerts
        env:
          ORACLE_API: ${{ vars.ORACLE_API || 'https://ps2-oracle.dayset.workers.dev' }}
          ORACLE_KEY: ${{ secrets.CENSUS_PROXY_KEY }}
        run: python3 oracle/backend/commander_actions.py
