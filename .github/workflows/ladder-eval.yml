name: Duels ladder eval

# Owner 2026-11-06: for two players who never met, does a full Glicko-2 ladder over every stored
# PC kill predict better than the ⚔️ iVi 🎲 fit? scripts/ladder-eval.mjs reads the private 24/7
# kill store (cache Worker /live/killclasses, proxy key) inside the runner; only totals leave it
# (::notice:: lines + data/ladder-eval.json) and the public 🌐 ladder data/ladder.json (rating per cached
# player, like iVi; no positions, removed players left out). Daily.

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "days back (max 31)"
        required: false
        default: "31"

permissions:
  contents: write

concurrency:
  group: ladder-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Evaluate
        env:
          CACHE_URL: ${{ vars.CENSUS_PROXY || 'https://ps2-elite-kd-cache.dayset.workers.dev' }}
          CENSUS_PROXY_KEY: ${{ secrets.CENSUS_PROXY_KEY }}
          DAYS: ${{ github.event.inputs.days || '31' }}
        run: node --max-old-space-size=12000 scripts/ladder-eval.mjs
      - name: Commit report
        env:
          COMMIT_DIR: data/
        run: |
          scripts/ci-commit-push.sh "chore(duels): ladder + eval report [bot]"
