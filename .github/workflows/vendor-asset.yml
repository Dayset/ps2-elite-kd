name: Vendor asset

# Copy an outside image into assets/ as WebP so the site never loads it from a
# third-party host (#61: no third-party requests from visitors' browsers;
# test/legal.test.mjs checks the pages and CSS). Manual run only:
#   gh api -X POST repos/Dayset/ps2-elite-kd/actions/workflows/vendor-asset.yml/dispatches \
#     -f ref=main -f "inputs[url]=https://…" -f "inputs[name]=site-bg.webp"
# Commits assets/<name> only.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "https URL of the image"
        required: true
      name:
        description: "file name under assets/ (lowercase, ends in .webp)"
        required: true
      quality:
        description: "WebP quality (1-100)"
        required: false
        default: "82"

permissions:
  contents: write # commit assets/<name>

concurrency:
  group: vendor-asset
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install cwebp
        run: sudo apt-get install -y -q webp >/dev/null

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Download and convert
        env:
          URL: ${{ inputs.url }}
          NAME: ${{ inputs.name }}
          QUALITY: ${{ inputs.quality }}
        run: |
          set -euo pipefail
          [[ "$URL" =~ ^https:// ]] || { echo "::error::url must start with https://"; exit 1; }
          [[ "$NAME" =~ ^[a-z0-9][a-z0-9-]*\.webp$ ]] || { echo "::error::name must look like site-bg.webp"; exit 1; }
          [[ "$QUALITY" =~ ^[0-9]{1,3}$ ]] || QUALITY=82
          tmp="$(mktemp -d)"
          curl -fsSL --max-time 60 --max-filesize 30000000 -A "ps2-elite-kd vendor-asset (+https://github.com/Dayset/ps2-elite-kd)" -o "$tmp/in" "$URL"
          type="$(file -b --mime-type "$tmp/in")"
          case "$type" in image/jpeg|image/png|image/webp|image/tiff) ;; *) echo "::error::not an image ($type)"; exit 1;; esac
          cwebp -quiet -q "$QUALITY" -metadata none "$tmp/in" -o "assets/$NAME"
          echo "::notice::assets/$NAME from $type: $(du -h "$tmp/in" | cut -f1) → $(du -h "assets/$NAME" | cut -f1), $(webpinfo -summary "assets/$NAME" 2>/dev/null | grep -m1 -o 'Width: *[0-9]*\|Canvas size [0-9]* x [0-9]*' || true)"

      - name: Commit (assets/ only)
        env:
          COMMIT_DIR: assets/
          NAME: ${{ inputs.name }}
        run: |
          scripts/ci-commit-push.sh "chore(assets): vendor $NAME (#61) [bot]"
