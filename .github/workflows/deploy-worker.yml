name: Deploy cache Worker

# Manual only: Actions → "Deploy cache Worker" → Run workflow.
# Leave "deploy" unticked for a dry run (tests + bundle check, nothing changes).
#
# One-time setup (repo Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token from the "Edit Cloudflare Workers" template,
#                          limited to this account
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare dashboard → Workers & Pages → Account ID

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Actually deploy (unticked = dry run only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            worker
            data/monitor.json
            test/worker-kv-budget.test.mjs
            test/worker-oracle-tick.test.mjs
            test/worker-room-tick.test.mjs
            test/worker-duel-store.test.mjs
            scrims.mjs
            package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "22" # node:sqlite for the duel store test

      - name: Worker tests
        run: node --test test/worker-kv-budget.test.mjs test/worker-oracle-tick.test.mjs test/worker-room-tick.test.mjs test/worker-duel-store.test.mjs

      - name: Dry run (bundle only)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --dry-run --outdir dist

      - name: Deploy
        if: inputs.deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      - name: Smoke check /duels/pair (#83)
        if: inputs.deploy
        run: |
          sleep 20
          u="https://ps2-elite-kd-cache.dayset.workers.dev/duels/pair?ns=ps2ps4us&p=5428916926438351409&q=5429365615044405249&want=3"
          for i in 1 2; do
            t0=$(date +%s%N)
            body=$(curl -s --max-time 60 "$u")
            ms=$(( ($(date +%s%N) - t0) / 1000000 ))
            echo "::notice title=duels/pair call $i (${ms} ms)::$(echo "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(JSON.stringify({v:j.v,fights:j.fights,kills:j.kills,pages:j.pages,blocks:j.blocks,done:j.done,lo:j.lo,hi:j.hi,events:(j.events||[]).length,error:j.error}))}catch{console.log(s.slice(0,300))}})')"
          done
