name: Oracle outlier effect

# Do extreme players decide alerts? (oracle-worker/history/outlier-effect.mjs)
# Honu answers GitHub Actions (not Cloudflare), one call a second; the per-alert
# Honu data is kept in the Actions cache so runs resume. Results: run annotations
# and oracle/backend/outlier_effect.json (aggregates only, committed when analyzed).

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "fetch | analyze | both"
        default: "both"
      minutes:
        description: "Honu fetch time budget (minutes)"
        default: "300"
      probe:
        description: "Probe only: fetch 5 alerts and report (true/false)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: oracle-outlier-effect
  cancel-in-progress: false

jobs:
  effect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Restore Honu cache
        uses: actions/cache/restore@v6
        with:
          path: history
          key: honu-alerts-${{ github.run_id }}
          restore-keys: honu-alerts-
      - name: Run
        env:
          ORACLE_API: ${{ vars.ORACLE_API || 'https://ps2-oracle.dayset.workers.dev' }}
        run: node oracle-worker/history/outlier-effect.mjs --cache history/honu-alerts.jsonl --minutes "${{ inputs.minutes }}" --phase "${{ inputs.phase }}" ${{ inputs.probe == 'true' && '--probe' || '' }}
      - name: Save Honu cache
        if: always() && inputs.probe != 'true'
        uses: actions/cache/save@v6
        with:
          path: history
          key: honu-alerts-${{ github.run_id }}
      - name: Commit results
        if: inputs.probe != 'true' && inputs.phase != 'fetch'
        run: |
          if [ -z "$(git status --porcelain oracle/backend/outlier_effect.json)" ]; then echo "::notice::no result changes"; exit 0; fi
          git config user.name "oracle-history[bot]"; git config user.email "oracle-history@users.noreply.github.com"
          git add oracle/backend/outlier_effect.json
          git commit -m "oracle: outlier effect measurement [bot]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
