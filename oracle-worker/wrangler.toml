# ps2-oracle: PS2MapOracle collector + odds engine + settlement.
# Deployed by .github/workflows/deploy-oracle.yml on every push that touches
# oracle-worker/ or the model files. Secret ORACLE_KEY is set by that workflow.
name = "ps2-oracle"
main = "src/index.js"
compatibility_date = "2025-07-18"
workers_dev = true
keep_vars = true

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ps2-oracle"
database_id = "477a2214-ced3-429f-aaef-96c0f0e2edd1"

# Archive: one JSON bundle per finished alert, kept for good (main DB keeps snapshots 30 days).
[[d1_databases]]
binding = "ARCHIVE"
database_name = "ps2-oracle-archive"
database_id = "46ed9c33-8e79-424f-954f-f8e570467fc3"

[observability]
enabled = true

# The cron fans the AI Commander out to one invocation per live alert through
# this binding to itself, so its CPU never counts against the odds cycle.
[[services]]
binding = "SELF"
service = "ps2-oracle"

# ⚔️ Live fights per base (#78, Workers Paid plan 2026-10-29): the cache Worker's KillMonitor keeps
# an in-memory live map of the PC event stream; src/fights.js asks it once a cycle per world
# with a live alert (GET /live/activity). Missing or unreachable → no fights, nothing else changes.
[[services]]
binding = "CACHE"
service = "ps2-elite-kd-cache"

# Login: listens to the Census stream only while a challenge is open.
[[durable_objects.bindings]]
name = "AUTH"
class_name = "AuthWatcher"

[[migrations]]
tag = "v1-auth-watcher"
new_sqlite_classes = ["AuthWatcher"]
