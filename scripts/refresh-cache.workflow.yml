name: Refresh shared cache

on:
  workflow_dispatch:
    inputs:
      names:
        description: "Comma/space-separated character names (leave empty to use data/watchlist.txt + existing index)"
        required: false
        default: ""
  schedule:
    # Hourly at minute 0 UTC
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: refresh-shared-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Raise under-load flag
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          node -e '
            const fs = require("fs");
            const payload = {
              fetching: true,
              ts: Date.now(),
              source: "actions",
              runId: process.env.RUN_ID || null,
              message: "Shared cache refresh in progress",
            };
            fs.mkdirSync("data", { recursive: true });
            fs.writeFileSync("data/load-flag.json", JSON.stringify(payload, null, 2) + "\n");
            console.log(payload);
          '
          git add data/load-flag.json
          git commit -m "chore: under-load flag on (cache refresh)" || echo "Flag already current"
          git push

      - name: Refresh player JSON
        env:
          NAMES: ${{ github.event.inputs.names || '' }}
        run: node scripts/refresh-cache.mjs

      - name: Commit shared cache
        run: |
          git add data/
          if git diff --staged --quiet; then
            echo "No player cache changes to commit."
          else
            git commit -m "chore: refresh shared player cache"
            git push
          fi

      - name: Clear under-load flag
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          # Ensure we have latest (cache commit may have raced); soft pull
          git pull --rebase --autostash || true
          node -e '
            const fs = require("fs");
            const payload = {
              fetching: false,
              ts: Date.now(),
              source: "actions",
              runId: process.env.RUN_ID || null,
              message: null,
            };
            fs.mkdirSync("data", { recursive: true });
            fs.writeFileSync("data/load-flag.json", JSON.stringify(payload, null, 2) + "\n");
            console.log(payload);
          '
          git add data/load-flag.json
          git commit -m "chore: under-load flag off" || echo "Flag already cleared"
          git push || {
            git pull --rebase --autostash || true
            git push
          }
